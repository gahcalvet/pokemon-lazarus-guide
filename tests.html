<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Testes · Guia de batalha</title><style>body{background:#111418;color:#d4ece0;font:15px monospace;padding:30px}pre{white-space:pre-wrap}</style><h1>Verificação dos perfis e matchups</h1><pre id="result">Executando verificações dos dois perfis…</pre><h2>Regressões Dreamstone</h2><pre id="dreamstone-result">Executando…</pre>
<script src="types.js?v=6"></script><script src="ranking.js?v=12"></script><script src="doubles.js?v=13"></script><script src="dreamstone-tests.js?v=2"></script>
<script>
Promise.all([fetch('team.json?v=12').then(r=>r.json()),fetch('battle-data.json?v=12').then(r=>r.json()),fetch('dreamstone-team.json?v=3').then(r=>r.json()),fetch('dreamstone-battle-data.json?v=2').then(r=>r.json())]).then(([lazarus,battleData,dreamstone,dreamstoneData])=>{
 Object.assign(dreamstone.team,{progress:dreamstone.progress,typeNotes:dreamstone.typeNotes});
 const tests=[],check=(name,fn)=>{if(!fn())throw Error(name);tests.push('✓ '+name)};
 try{
  check('Lazarus mantém os seis Pokémon confirmados',()=>lazarus.team.map(p=>p.name).join('|')==='Torracat|Aegislash|Gliscor|Gardevoir|Carracosta|Lapras');
  check('Lazarus mantém Lapras, Water Absorb e Ice Beam',()=>{const p=lazarus.team.find(x=>x.name==='Lapras');return p.ability==='Water Absorb'&&p.moves.some(m=>m[0]==='Ice Beam')});
  check('Lazarus: Poison Heal, Toxic Orb e golpes de Gliscor',()=>{const p=lazarus.team.find(x=>x.name==='Gliscor');return p.ability==='Poison Heal'&&p.item==='Toxic Orb'&&p.moves.map(m=>m[0]).join('|')==='U-turn|Fly|Rock Tomb|Knock Off'});
  check('18 tipos carregam e a imunidade Water Absorb não afeta outros tipos',()=>Object.keys(TYPES).length===18&&defensiveEffectiveness('water',lazarus.team.find(p=>p.name==='Lapras'))===0&&defensiveEffectiveness('electric',lazarus.team.find(p=>p.name==='Lapras'))===effectiveness('electric',lazarus.team.find(p=>p.name==='Lapras').types));
  check('Lazarus individual e duplas retornam apenas integrantes do perfil',()=>{const a=quickRanking(['water'],lazarus.team,battleData),d=doubleAnalyze([['water'],['flying']],lazarus.team,battleData,['Lapras','Gliscor']);return a.direct.length===6&&d.valid&&d.all.length===15&&d.all.every(x=>x.pair.every(p=>lazarus.team.includes(p)))});
  const dreams=runDreamstoneTests(lazarus.team,battleData,dreamstone.team,dreamstoneData);document.querySelector('#dreamstone-result').textContent=dreams.join('\n')+'\n\n'+dreams.length+' testes Dreamstone passaram.';
  document.querySelector('#result').textContent=tests.join('\n')+'\n\n'+tests.length+' verificações de regressão Lazarus passaram.';
 }catch(e){document.querySelector('#result').textContent='FALHA: '+e.message;throw e}
}).catch(e=>{document.querySelector('#result').textContent='FALHA: '+e.message;throw e});
</script></html>
